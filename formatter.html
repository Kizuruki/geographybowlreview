<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography Bowl Question Formatter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .format-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .format-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 15px;
            padding: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
        }

        .format-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .format-card.active {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            transform: translateY(-2px);
        }

        .input-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .output-section {
            background: #2c3e50;
            color: #ecf0f1;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .output-content {
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .category-questions {
            background: rgba(118, 75, 162, 0.05);
            border: 2px dashed #764ba2;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .question-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .remove-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            float: right;
        }

        .add-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Geography Bowl Question Formatter</h1>
        
        <div class="format-selector">
            <button class="format-card active" onclick="selectFormat('simple')">
                📝 Simple Q&A<br>
                <small>Basic question-answer pairs</small>
            </button>
        </div>

        <div class="input-section">
            <!-- Simple Q&A Format -->
            <div id="simple-form">
                <h3>Simple Geography Question & Answer</h3>
                <div class="form-group">
                    <label for="simple-question">Question:</label>
                    <textarea id="simple-question" placeholder="Enter your geography question here..."></textarea>
                </div>
                <div class="form-group">
                    <label for="simple-answer">Answer:</label>
                    <input type="text" id="simple-answer" placeholder="Enter the answer (separate multiple answers with commas)...">
                    <small style="color: #666; font-style: italic;">Tip: Use commas to separate multiple acceptable answers</small>
                </div>
                <button class="btn" onclick="addSimpleQuestion()">Add Question</button>
            </div>
        </div>

        <div class="form-group">
            <button class="btn" onclick="generateOutput()">Generate JSON</button>
            <button class="btn btn-secondary" onclick="clearAll()">Clear All</button>
            <button class="btn btn-secondary" onclick="loadSampleData()">Load Sample Data</button>
            <button class="btn btn-secondary" onclick="downloadJSON()">Download JSON</button>
        </div>
        
        <div class="form-group">
            <label for="json-file-input">Import Existing JSON File:</label>
            <input type="file" id="json-file-input" accept=".json" multiple onchange="importJSON()" style="margin-bottom: 10px; padding: 10px; border: 2px dashed #667eea; border-radius: 10px; background: #f8f9fa;">
            <small style="color: #666; font-style: italic; display: block;">Select a JSON file to import and add to your current questions</small>
        </div>

        <div class="output-section">
            <h3>Generated JSON Output:</h3>
            <div class="output-content" id="output"></div>
        </div>

        <div class="form-group">
            <button class="btn" onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            updateOutput();
        });
        let currentFormat = 'simple';
        let questionData = [];

        function selectFormat(format) {
            // Update active button
            document.querySelectorAll('.format-card').forEach(card => card.classList.remove('active'));
            event.target.classList.add('active');
            
            // Hide all forms
            document.querySelectorAll('[id$="-form"]').forEach(form => form.classList.add('hidden'));
            
            // Show selected form
            document.getElementById(format + '-form').classList.remove('hidden');
            
            currentFormat = format;
        }

        function addSimpleQuestion() {
            const question = document.getElementById('simple-question').value.trim();
            const answer = document.getElementById('simple-answer').value.trim();
            
            if (!question || !answer) {
                alert('Please fill in both question and answer');
                return;
            }
            
            // Process multiple answers
            const processedAnswer = processMultipleAnswers(answer);
            
            questionData.push({ question, answer: processedAnswer });
            
            // Clear inputs
            document.getElementById('simple-question').value = '';
            document.getElementById('simple-answer').value = '';
            
            updateOutput();
        }

        function processMultipleAnswers(answerString) {
            // Check if the answer contains commas
            if (answerString.includes(',')) {
                // Split by commas and trim whitespace
                const answers = answerString.split(',').map(answer => answer.trim()).filter(answer => answer.length > 0);
                return answers.length > 1 ? answers : answerString;
            }
            return answerString;
        }

        function generateOutput() {
            updateOutput();
        }

        function updateOutput() {
            const output = JSON.stringify({ questions: questionData }, null, 2);
            document.getElementById('output').textContent = output;
        }

        function clearAll() {
            questionData = [];
            updateOutput();
        }

        function importJSON() {
            const fileInput = document.getElementById('json-file-input');
            const files = fileInput.files;

            if (!files || files.length === 0) {
                return;
            }

            let filesProcessed = 0;
            let anyImported = false;
            let summary = [];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        
                        // Validate the structure
                        if (!importedData || !importedData.questions || !Array.isArray(importedData.questions)) {
                            throw new Error(`Invalid JSON structure in file: ${file.name}`);
                        }
                        
                        // Merge with existing data
                        questionData = [...questionData, ...importedData.questions];
                        summary.push(`${file.name} - ${importedData.questions.length} questions added`);
                        anyImported = true;
                    } catch (error) {
                        alert(`Error importing JSON file \"${file.name}\".\n\n${error.message}`);
                    }
                    filesProcessed++;
                    if (filesProcessed === files.length) {
                        updateOutput();
                        if (anyImported) {
                            alert("JSON file(s) imported:\n" + summary.join('\n'));
                        }
                        fileInput.value = '';
                    }
                };
                reader.readAsText(file);
            }
        }

        function loadSampleData() {
            // Load sample geography questions
            questionData = [
                {
                    "question": "What is the capital of France?",
                    "answer": "Paris"
                },
                {
                    "question": "Which ocean is the largest?",
                    "answer": "Pacific Ocean"
                },
                {
                    "question": "What is the longest river in the world?",
                    "answer": ["Nile", "Nile River"]
                },
                {
                    "question": "What mountain range separates Europe from Asia?",
                    "answer": ["Ural Mountains", "Urals"]
                },
                {
                    "question": "What is the smallest country in the world?",
                    "answer": ["Vatican City", "Vatican"]
                }
            ];
            updateOutput();
        }

        function copyToClipboard() {
            const output = document.getElementById('output').textContent;
            navigator.clipboard.writeText(output).then(() => {
                alert('JSON copied to clipboard!');
            });
        }

        function downloadJSON() {
            const output = document.getElementById('output').textContent;
            const blob = new Blob([output], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'geography_questions.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
